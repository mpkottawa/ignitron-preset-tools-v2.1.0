name: Build and test release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to publish (leave blank for artifacts only)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-gi desktop-file-utils
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m py_compile ignitron_preset_tools_v2.1.py preset_capture.py preset_puller.py preset_chart.py preset_converter.py release_tools.py
      - name: Run tests
        timeout-minutes: 3
        env:
          IGNITRON_BASELINE: Ignitron 1.9.0
        run: python -u -c "import faulthandler, unittest; faulthandler.dump_traceback_later(60, exit=True); unittest.main(module=None, argv=['unittest', 'discover', '-v'])"
      - name: Verify clean dual-firmware source staging
        if: runner.os == 'Linux'
        run: python release_tools.py stage-source . "${RUNNER_TEMP}/ipt-source-release"

  windows:
    name: Windows x64 package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows package
        shell: pwsh
        run: ./build_release.ps1
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem -LiteralPath release -Filter "*Windows-x64-Setup.exe")
          if ($setup.Count -ne 1) { throw "Expected one Windows Setup executable; found $($setup.Count)." }
          $buildScript = Get-Content -LiteralPath build_release.ps1 -Raw
          $versionMatch = [regex]::Match($buildScript, '\$ReleaseVersion\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) { throw "Could not read the packaged release version." }
          $releaseVersion = $versionMatch.Groups[1].Value
          $legacyInstallDir = Join-Path $env:RUNNER_TEMP "Ignitron Preset Tools v2.1.03"
          $installDir = Join-Path $env:RUNNER_TEMP "Ignitron Preset Tools v$releaseVersion"
          $setupProcess = Start-Process -FilePath $setup[0].FullName -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$legacyInstallDir"
          ) -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Setup exited with code $($setupProcess.ExitCode)." }
          $apps = @(Get-ChildItem -LiteralPath $legacyInstallDir -Filter "Ignitron Preset Tools v*.exe" -File)
          if ($apps.Count -ne 1) { throw "Expected one installed IPT executable; found $($apps.Count)." }
          $upgradeMarker = Join-Path $legacyInstallDir "ignitron firmware\upgrade-marker.txt"
          Set-Content -LiteralPath $upgradeMarker -Value "preserve this firmware copy"
          $upgradeProcess = Start-Process -FilePath $setup[0].FullName -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS"
          ) -Wait -PassThru
          if ($upgradeProcess.ExitCode -ne 0) { throw "Upgrade setup exited with code $($upgradeProcess.ExitCode)." }
          if (Test-Path -LiteralPath $legacyInstallDir) {
            throw "Upgrade left the previous version-named installation folder behind."
          }
          $apps = @(Get-ChildItem -LiteralPath $installDir -Filter "Ignitron Preset Tools v*.exe" -File)
          if ($apps.Count -ne 1) { throw "Expected one upgraded IPT executable; found $($apps.Count)." }
          $app = $apps[0].FullName
          $programmingSetup = Join-Path $installDir "windows_programming_setup.ps1"
          $firmware = Join-Path $installDir "ignitron firmware\platformio.ini"
          foreach ($required in @($app, $programmingSetup, $firmware)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Installer omitted $required" }
          }
          $backupRoot = Join-Path $installDir "firmware backups"
          $backupMarkers = @(Get-ChildItem -LiteralPath $backupRoot -Filter "upgrade-marker.txt" -File -Recurse)
          if ($backupMarkers.Count -ne 1) {
            throw "Expected the upgrade to preserve one firmware marker; found $($backupMarkers.Count)."
          }
          if (-not (Test-Path -LiteralPath $firmware)) { throw "Upgrade did not install a fresh firmware copy." }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $programmingSetup -SelfTest -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Installed programming setup self-test failed." }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstallProcess.ExitCode)." }
      - uses: actions/upload-artifact@v4
        with:
          name: Ignitron-Preset-Tools-v2.1.04-Windows-x64
          path: |
            release/*Windows-x64.zip
            release/*Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} package
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build macOS package
        run: |
          chmod +x build_release_mac.sh
          ./build_release_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ignitron-Preset-Tools-v2.1.04-macOS-${{ matrix.arch }}
          path: release/*macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} package
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI and VLC runtimes
        run: sudo apt-get update && sudo apt-get install -y python3-tk vlc libvlc-dev desktop-file-utils
      - name: Build Linux package
        run: |
          chmod +x build_release_linux.sh
          ./build_release_linux.sh
      - name: Verify packaged Linux VLC runtime
        shell: bash
        run: |
          package_dir=$(find release -maxdepth 1 -type d -name '*Linux-${{ matrix.arch }}' -print -quit)
          test -n "$package_dir"
          desktop-file-validate "$package_dir/Install Ignitron.desktop"
          (cd "$package_dir" && sha256sum --check --strict --quiet linux-bundle.sha256)
          bash "$package_dir/setup_linux.sh" --check
          "$package_dir/app/ignitron-preset-tools" --vlc-self-test
      - uses: actions/upload-artifact@v4
        with:
          name: Ignitron-Preset-Tools-v2.1.04-Linux-${{ matrix.arch }}
          path: release/*Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if needed and upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" != "v2.1.04" ]]; then
            echo "Release tag $RELEASE_TAG does not match packaged version v2.1.04" >&2
            exit 1
          fi
          for package in artifacts/*; do
            canonical="${package// /.}"
            if [[ "$package" != "$canonical" ]]; then mv "$package" "$canonical"; fi
          done
          cp Linux-Install-Guide.pdf artifacts/
          cp setup_linux.sh artifacts/Install-IPT-Linux.sh
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Ignitron Preset Tools $RELEASE_TAG" --notes-file GITHUB_RELEASE.md
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file GITHUB_RELEASE.md
